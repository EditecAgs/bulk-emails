
name: Deploy Bulk Emails

on:
  push:
    branches:
      - deploy-server
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-emails-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bulk-emails]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Mostrar versiones del entorno
        run: |
          set -euxo pipefail
          node --version
          npm --version
          php --version
          composer --version
          rsync --version

      - name: Instalar dependencias frontend
        run: |
          set -euxo pipefail
          npm ci

      - name: Ejecutar build
        run: |
          set -euxo pipefail
          export NODE_OPTIONS="--max-old-space-size=1024"
          npm run build

      - name: Verificar build
        run: |
          set -euxo pipefail
          test -f public/build/manifest.json
          ls -lh public/build/manifest.json

      - name: Verificar configuración del servidor
        run: |
          set -euxo pipefail
          test -f /var/www/html/bulk-emails/.env
          test -f /var/www/html/bulk-emails/artisan
          test -d /var/www/html/bulk-emails/storage
          echo "Configuración y directorios verificados."

      - name: Copiar aplicación al servidor
        run: |
          set -euxo pipefail
          rsync -av --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='bootstrap/cache/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ /var/www/html/bulk-emails/

      - name: Instalar dependencias PHP
        working-directory: /var/www/html/bulk-emails
        run: |
          set -euxo pipefail
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Actualizar Laravel
        working-directory: /var/www/html/bulk-emails
        run: |
          set -euxo pipefail
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache

      - name: Reiniciar servicio de la cola
        run: |
          set -euxo pipefail
          sudo -n /usr/bin/systemctl restart bulk-emails-queue
          sudo -n /usr/bin/systemctl is-active bulk-emails-queue
          echo "Servicio de cola reiniciado y activo."
